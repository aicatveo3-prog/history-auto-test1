</style></head><body><main><header><a class="back" href="한국사_시나리오_사이트.html">← 전체 100편으로 돌아가기</a><div class="eyebrow">THREE WAYS TO TELL HISTORY</div><h1>같은 한국사, 다른 이야기 방식.</h1><p>인물의 선택, 제도의 작동, 유물의 증거를 따라 새로 쓴 세 편입니다. 유형을 골라 읽고 직전 시안과 압축 개정판을 비교해 보세요. 전체 100편 개정의 기준이 된 비교 시안입니다. 인물형·문화형은 해당 상위 주제에 구성 원칙을 반영했습니다.</p></header><nav role="tablist" aria-label="시나리오 유형" id="tabs"></nav><div id="view"></div><footer>실제 낭독 시간은 아직 측정하지 않았습니다. 검토는 작성자의 자체 검토이며 사용자 평가를 기다리는 초안입니다.<br><a href="docs/편집기준.md">자료 출처와 5단계 편집 기록</a> · <a href="한국사_시나리오_사이트.html">전체 시나리오 작업실</a></footer></main><script>
const cases=[{"id":"gwangjong","kind":"인물형","name":"광종","file":"인물형_광종_v002.md","episode":21,"strategy":"권력의 기반이 달라지는 과정을 따라갑니다.","scope":"왼쪽은 직전 시안(v001), 오른쪽은 압축 개정판(v002)입니다. 기존 100편의 21번 주제와 연결한 별도 시안입니다.","goals":["노비안검법의 대상과 호족·국가에 미친 효과","과거제·공복의 기능과 개혁 군주 평가의 한계"],"sources":[{"title":"우리역사넷 · 노비안검법","url":"https://contents.history.go.kr/mobile/tg/view.do?levelId=tg_002_0350&pageUnit=10"},{"title":"우리역사넷 · 과거제","url":"https://contents.history.go.kr/mobile/kc/view.do?code=kc_age_20&levelId=kc_i200307"}],"sourcePath":"01_스토리/비교시안/인물형_광종_v002.md","title":"광종 — 호족의 힘을 줄이는 법","text":"광종은 왕이 되었지만, 나라를 세운 공신과 호족들의 힘도 여전히 컸습니다. 많은 토지와 사람을 거느린 이들 앞에서, 왕의 권한을 키울 방법이 필요했어요.\n\n956년, 광종은 노비안검법을 실시합니다. 노비가 된 경위를 조사해, 본래 양인이었지만 억울하게 노비가 된 사람을 다시 양인으로 돌려놓는 법입니다. 모든 노비를 해방한 것은 아니에요.\n\n이 정책이 호족에게 타격을 준 이유는 분명합니다. 노비는 호족의 땅에서 농사를 짓는 노동력이었고, 사병의 기반이 되기도 했습니다. 노비가 양인으로 돌아가면 호족이 거느린 사람은 줄고, 국가는 세금과 역을 부담할 양인을 확보할 수 있었죠. 신분을 바로잡는 정책이 호족의 경제적·군사적 기반도 약화시킨 겁니다.\n\n반발은 컸습니다. 광종의 왕비인 대목왕후까지 시행을 만류했다는 기록이 전해져요. 그만큼 기존 세력이 가진 이익을 건드린 개혁이었습니다.\n\n958년에는 쌍기의 건의로 과거제를 실시합니다. 시험으로 관리를 뽑아 새로운 인재가 진출할 길을 열었죠. 오늘날처럼 누구에게나 열린 시험은 아니었지만, 기존 세력의 배경에만 기대지 않는 선발 통로가 마련되었습니다.\n\n관리의 공복도 정했습니다. 관직에 따라 입는 옷을 구별해 조정의 위계를 드러낸 거예요. 사람을 거느리는 힘과 관리가 되는 길, 왕 앞에서의 질서를 함께 바꾸려 했던 것입니다.\n\n광종은 이런 개혁으로 왕권을 강화했습니다. 하지만 재위 후반에는 강경한 숙청으로 많은 희생도 남겼습니다. 고려의 국가 기반을 다진 성과와 권력을 행사한 방식의 문제를 함께 보아야 하는 왕입니다.","characters":769,"previous":{"title":"광종 — 노비를 풀어줬는데, 왕이 강해졌다","text":"노비의 신분을 바로잡았는데, 왕의 힘이 강해집니다. 반대로 나라를 세우는 데 공을 세운 호족들은 손해를 봅니다. 사람의 신분을 조사하는 법이 어떻게 권력까지 바꾼 걸까요?\n\n고려 초의 호족은 지방에 뿌리를 둔 유력자였습니다. 많은 토지와 사람을 거느렸고, 그 힘을 바탕으로 왕실과도 관계를 맺었어요. 태조 왕건에게는 나라를 세우고 통일하는 데 필요한 동료들이었죠. 하지만 왕이 바뀐 뒤에도 그들의 힘은 남았습니다. 왕좌에 앉았다고 모든 권력이 왕에게 모이는 상황은 아니었어요.\n\n광종은 그 기반 가운데 하나인 노비 문제에 손을 댑니다. 956년, 노비안검법을 실시했어요. 노비가 된 경위를 살펴, 본래 양인이었지만 억울하게 노비가 된 사람들을 다시 양인으로 돌려놓는 정책입니다. 모든 노비를 한꺼번에 해방한 법은 아닙니다.\n\n여기서 호족의 손익이 달라집니다. 노비는 토지를 경작하는 노동력이었고, 사병의 기반이 되기도 했습니다. 그 사람이 양인으로 돌아가면 호족은 거느리던 인적 자원을 잃습니다. 국가는 조세와 역을 부담하는 양인을 더 확보할 수 있었죠. 신분 회복은 한 사람의 삶을 바꾸는 일이면서, 왕과 호족 사이의 힘을 움직이는 일이기도 했습니다.\n\n반발은 왕 가까이에서도 나왔습니다. 광종의 왕비인 대목왕후까지 시행을 만류했다는 기록이 전해져요. 개혁안에 이름을 적는 것과 실제로 시행하는 것 사이에는 이렇게 강한 이해관계가 놓여 있었습니다.\n\n광종은 인재를 뽑는 길도 바꿉니다. 958년, 쌍기의 건의로 과거제를 실시했어요. 시험으로 새로운 인물을 등용할 통로를 마련한 것이죠. 그렇다고 신분의 제한이 사라지거나 기존 인맥이 모두 없어지는 것은 아니었습니다. 이어 관리의 공복을 정해 조정의 위계도 정비합니다.\n\n노비안검법은 호족이 거느린 사람을, 과거제는 관리가 되는 통로를, 공복은 조정의 질서를 바꾸었습니다. 광종의 정책을 따라가면 왕권 강화라는 말이 구체적인 행동으로 보입니다.\n\n다만 그 과정 전체를 밝은 개혁 이야기로만 끝낼 수는 없습니다. 재위 후반에는 강경한 숙청으로 많은 희생도 발생했습니다. 광종이 키운 왕의 힘은 새 질서의 기반이 되었지만, 그 힘을 행사하는 방식은 또 다른 질문을 남겼습니다.","sourcePath":"01_스토리/비교시안/인물형_광종_v001.md"},"beforeCharacters":1076,"reductionPercent":29},{"id":"daedong","kind":"제도형","name":"대동법","file":"제도형_대동법_v002.md","episode":50,"strategy":"공물과 비용이 어느 손을 거치는지 따라갑니다.","scope":"왼쪽은 직전 시안(v001), 오른쪽은 압축 개정판(v002)입니다. 기존 100편의 50번 주제와 연결한 별도 시안입니다.","goals":["방납의 문제와 공납 부담 기준의 변화","공인의 물품 조달과 상품 유통의 연결","대토지 소유자와 방납인의 반대 이유"],"sources":[{"title":"우리역사넷 · 대동법 시행","url":"https://contents.history.go.kr/front/hm/view.do?levelId=hm_102_0040"},{"title":"우리역사넷 · 공인","url":"https://contents.history.go.kr/front/tg/view.do?ganada=%EC%A0%84%EC%B2%B4&levelId=tg_003_1600&pageUnit=10&treeId=0105"},{"title":"우리역사넷 · 대동법 반대의 이해관계","url":"https://contents.history.go.kr/front/nh/print.do?levelId=nh_030_0060_0010_0010_0030"}],"sourcePath":"01_스토리/비교시안/제도형_대동법_v002.md","title":"대동법 — 누가 더 내고, 누가 이익을 잃었을까?","text":"나라에 바칠 특산물을 구하지 못했습니다. 대신 내주겠다는 사람은 비싼 값을 요구합니다. 공물을 대납하고 이익을 얻는 방납이 퍼지면서, 농민은 물건을 구하는 데도 큰 부담을 져야 했어요.\n\n이를 바꾸려 1608년 광해군 때 경기도에서 대동법을 시작합니다. 공납을 특산물 대신 쌀 등으로 내게 하고, 부담도 토지 결수에 따라 매겼습니다. 이후 지역에 따라 베나 동전으로 내기도 했죠. 모든 세금을 합친 것이 아니라 공납을 개편한 제도입니다.\n\n이제 백성이 쌀을 내도 관청에는 여전히 종이와 옷감이 필요합니다. 그 물건은 누가 구할까요? 국가가 공인에게 공가, 즉 물품을 마련할 대가를 지급하면 공인이 구매하거나 만들어 공급했습니다. 농민이 물건을 직접 마련하던 부담을 덜고, 국가는 공식적인 조달 체계를 갖춘 것입니다.\n\n그런데 모두가 반기지는 않았습니다. 토지를 기준으로 공납을 매기면 땅이 적은 농민의 부담은 줄어드는 반면, 많은 땅을 가진 쪽은 그만큼 대동미를 내야 했습니다. 대토지 소유자들이 반발한 이유죠.\n\n방납으로 큰 차익을 얻던 사람들도 기존의 이익을 지키기 어려워졌습니다. 일부는 공인으로 활동을 이어갔지만, 국가가 정한 대가를 받는 방식에서는 예전처럼 큰 방납 이익을 얻기 어려웠어요. 부담을 덜게 된 사람과 이익이 줄어든 사람의 반응이 달랐던 겁니다.\n\n이런 반대에 운송과 지역 재정 문제까지 겹쳐 확대는 더뎠습니다. 김육 등이 추진했지만 여러 지역으로 퍼지기까지 오랜 시간이 걸렸죠. 한편 공인이 물품을 사들이면서 생산과 운송, 상품 유통도 활발해졌습니다.\n\n대동법은 낼 물건만 바꾼 정책이 아니었습니다. 누가 얼마나 부담하고, 국가가 누구에게 물건을 구할지를 함께 바꾼 개혁이었습니다.","characters":842,"previous":{"title":"대동법 — 쌀을 받으면, 필요한 물건은 누가 구할까?","text":"관청에 낼 공물을 구하지 못했습니다. 그런데 누군가 대신 마련해 주겠다며 비싼 값을 요구합니다. 내야 할 물건값보다, 그 물건을 구하는 과정이 더 무거운 부담이 된다면요? 조선의 공납에는 이런 문제가 있었습니다.\n\n공납은 지역의 특산물 등을 나라에 바치는 제도였습니다. 문제는 실제로 그 지역에서 구하기 어려워진 물건도 계속 배정될 수 있었다는 점이에요. 납부할 물건은 정해져 있는데, 집에 곡식이 있다고 그것으로 마음대로 바꿔 낼 수도 없었습니다.\n\n그 틈에서 공물을 대신 내고 이익을 얻는 방납이 퍼졌습니다. 상인과 관리가 얽혀 과도한 대가를 요구하면 농민의 부담은 커집니다. 백성은 더 힘들어지는데 국가의 수입이 그만큼 늘어나는 것도 아니었어요. 공물을 마련하는 방식 자체를 손봐야 했습니다.\n\n1608년 광해군 때, 경기도에서 대동법이 시작됩니다. 특산물을 직접 바치게 하는 대신 쌀 등으로 거두고, 부담의 기준도 토지 결수에 두었습니다. 이후 지역 사정에 따라 베나 동전으로 내기도 했어요. 핵심은 공납을 바꾸었다는 점입니다. 모든 세금을 쌀 하나로 통일했다는 뜻은 아니에요.\n\n그런데 왕실과 관청에는 여전히 종이도 옷감도 필요합니다. 쌀을 받았다고 필요한 물건이 저절로 생기지는 않죠. 이 빈자리를 연결한 사람들이 공인입니다. 국가는 공가, 즉 물품을 마련할 대가를 지급하고, 공인은 필요한 물건을 구입하거나 만들어 공급했습니다.\n\n농민이 물건을 직접 구해 바치던 부담의 일부가 국가의 조달 체계로 옮겨 간 것입니다. 공인이 물건을 구하려면 생산자와 거래하고 운송도 해야 합니다. 그래서 대동법은 세금 제도의 개편이면서 상품 유통의 성장과도 연결됩니다. 공인은 국가가 공식적으로 인정한 조달 상인이었다는 점에서 이전의 방납 상인과 구별해야 해요.\n\n좋은 취지의 개혁이었지만 확대는 더뎠습니다. 부담의 기준이 달라지면 토지를 많이 가진 사람과 기존에 이익을 얻던 사람의 이해관계도 달라집니다. 지역별 운송과 재정 문제도 있었어요. 김육 등이 확대를 추진했지만, 경기도의 시작에서 여러 지역으로 퍼지기까지는 오랜 시간이 걸렸습니다.\n\n처음 농민이 떠안았던 문제는 공물 하나를 구하는 일이었습니다. 대동법은 그 물건을 누가 마련하고, 비용은 어떤 기준으로 낼지를 다시 정했습니다. 그 뒤를 따라가면 농민과 국가, 공인과 시장이 한 제도로 연결됩니다.","sourcePath":"01_스토리/비교시안/제도형_대동법_v001.md"},"beforeCharacters":1150,"reductionPercent":27},{"id":"muryeong","kind":"문화형","name":"무령왕릉","file":"문화형_무령왕릉_v002.md","episode":8,"strategy":"무덤의 주인을 확인하는 증거를 하나씩 읽습니다.","scope":"왼쪽은 직전 시안(v001), 오른쪽은 압축 개정판(v002)입니다. 기존 100편의 08번 주제와 연결한 별도 시안입니다.","goals":["공주·웅진기의 벽돌무덤과 지석의 역할","유물로 확인한 사실과 아직 모르는 내용의 구별"],"sources":[{"title":"국립중앙박물관 · 무령왕릉 관 꾸미개","url":"https://www.museum.go.kr/MUSEUM/contents/M0501000000.do?relicRecommendId=16892&schM=view"},{"title":"국립중앙박물관 · 받침 있는 은잔","url":"https://www.museum.go.kr/MUSEUM/contents/M0501000000.do?pageSize=10&relicRecommendCategory=&relicRecommendId=1569306&sc=&schM=view&sv="}],"sourcePath":"01_스토리/비교시안/문화형_무령왕릉_v002.md","title":"무령왕릉 — 무덤의 주인을 알려준 돌","text":"금 장신구가 가득한 무덤도 주인의 이름은 모를 수 있습니다. 무령왕릉에서 그 이름을 알려준 것은 화려한 금이 아니라 글이 새겨진 돌, 지석이었어요.\n\n1971년 공주 송산리 고분군의 배수로 공사 중 무덤이 발견됩니다. 공주는 백제가 웅진을 수도로 삼았던 곳입니다. 무덤 안에서는 벽돌로 쌓은 무덤방과 장신구, 거울, 도자기 등이 확인됐어요.\n\n벽돌무덤은 중국 남조 문화의 영향을 보여주는 단서였습니다. 금제 관식 같은 장식은 왕실 문화를, 석수는 무덤을 지키려는 관념을 살피게 하죠. 하지만 이런 물건만으로 어느 왕이 묻혔는지 확정할 수는 없습니다.\n\n지석에는 왕과 왕비에 관한 기록이 남아 있었습니다. 덕분에 무덤의 주인과 시기를 확인할 수 있었어요. 지석은 죽은 사람에 관한 내용을 새겨 무덤에 넣은 돌입니다. 다른 유물이 지위와 문화를 보여준다면, 이 돌은 이름과 시간을 알려준 셈이죠.\n\n시기를 아는 무덤의 유물은 다른 유물을 비교하는 기준도 됩니다. 비슷한 장식과 제작 방식이 어느 때 사용되었는지 살피는 데 도움을 주기 때문입니다. 무령왕릉이 백제 문화 연구에서 중요한 이유예요.\n\n그래도 모르는 것은 남아 있습니다. 왕비의 관에서 나온 은잔은 평소 쓰던 물건인지, 장례를 위해 만든 것인지 정확히 모릅니다. 무엇을 담았는지도 확실하지 않아요. 유물이 나왔다고 용도까지 모두 알게 되는 것은 아닙니다.\n\n무령왕릉에서는 벽돌무덤과 출토품으로 문화와 교류를, 지석으로 주인과 시기를 살핍니다. 각 증거가 알려주는 범위를 구별하면, 유물 이름을 외우는 데서 나아가 왜 중요한 자료인지 이해할 수 있습니다.","characters":789,"previous":{"title":"무령왕릉 — 금보다 먼저 읽어야 할 돌","text":"금으로 만든 장신구가 나와도, 그 무덤에 누가 묻혔는지는 모를 수 있습니다. 귀한 물건이 많다는 사실과 주인의 이름을 안다는 것은 다른 문제예요. 무령왕릉에서는 글이 적힌 돌이 그 이름을 알려주었습니다.\n\n1971년, 공주 송산리 고분군에서 배수로 공사를 하던 중 무덤이 발견됩니다. 백제가 웅진을 수도로 삼았던 지역입니다. 발굴조사에서는 벽돌로 쌓은 무덤방과 여러 장신구, 거울과 도자기 등이 확인되었어요.\n\n벽돌무덤이라는 구조는 중요한 단서였습니다. 중국 남조 문화의 영향을 살필 수 있죠. 하지만 벽돌을 쌓았다는 사실만으로 어느 왕의 무덤인지 단정할 수는 없습니다. 화려한 장신구 역시 묻힌 사람의 높은 지위를 짐작하게 하지만, 이름까지 말해 주지는 않아요.\n\n여기서 지석, 또는 묘지석이 등장합니다. 죽은 사람에 관한 내용을 새겨 무덤에 넣은 돌입니다. 무령왕릉의 지석에는 왕과 왕비에 관한 기록이 남아 있어 무덤의 주인과 시기를 확인할 수 있었습니다. 막연히 백제의 높은 사람이라고 추측하던 수준에서, 누구의 무덤인지 근거를 갖고 말할 수 있게 된 거예요.\n\n이름과 시기를 알면 다른 유물도 새롭게 보입니다. 어느 때의 왕릉에서 나온 장식인지 기준이 생기기 때문입니다. 다른 무덤의 비슷한 유물을 비교할 때도 중요한 자료가 되죠. 금제 관식은 장식의 아름다움과 왕실 문화를, 출토된 석수는 무덤을 지키려는 관념을 살피게 합니다.\n\n물론 출토품이 모든 질문에 답하는 것은 아닙니다. 왕비의 관에서 나온 은잔은 관 안에 넣을 만큼 의미 있는 물건이었겠지만, 평소 쓰던 물건인지 장례를 위해 새로 만든 것인지는 정확히 모릅니다. 무엇을 담았는지도 확실하지 않아요. 확인된 사실과 아직 모르는 부분을 나누는 일 역시 유물을 읽는 방법입니다.\n\n공주의 무령왕릉은 백제 웅진기의 벽돌무덤입니다. 지석으로 주인과 시기를 확인했고, 구조와 출토품으로 왕실 문화와 대외 교류를 살핍니다. 무덤 안의 물건들은 각각 다른 질문에 답하고 있었던 셈이에요.\n\n전시실에서 눈길을 끄는 것은 반짝이는 금일 수 있습니다. 하지만 그 옆의 글 새긴 돌을 읽는 순간, 화려한 물건들이 이름과 시간을 가진 한 무덤의 자료로 묶입니다. 무령왕릉의 특별함은 그 연결에 있습니다.","sourcePath":"01_스토리/비교시안/문화형_무령왕릉_v001.md"},"beforeCharacters":1091,"reductionPercent":28}];let active=cases[0].id;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const c=cases.find(x=>x.id===active)||cases[0];$('#tabs').innerHTML=cases.map(x=>`<button role="tab" aria-selected="${x.id===c.id}" data-case="${esc(x.id)}">${esc(x.kind)} · ${esc(x.name)}</button>`).join('');$('#view').innerHTML=`<div class="summary"><span class="pill">${esc(c.kind)} 시안</span><h2>${esc(c.title)}</h2></div><p class="approach">${esc(c.strategy)}</p><p class="note">${esc(c.scope)}</p><div class="grid"><article class="card old"><div class="cardhead"><b>수정 전 · v001</b><span>${c.beforeCharacters}자</span></div><h3>${esc(c.previous.title)}</h3><div class="text">${esc(c.previous.text)}</div></article><article class="card new"><div class="cardhead"><b>압축 개정 · v002</b><span>${c.characters}자 · ${c.reductionPercent}% 압축</span><button class="copy" id="copy">본문 복사</button></div><div class="text" id="narration">${esc(c.text)}</div><div class="foot"><a href="${esc(c.sourcePath)}">이 시나리오 원본 열기 ↗</a></div></article></div><details class="details"><summary>학습 포인트와 출처 확인</summary><ul>${c.goals.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><p>${c.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a>`).join('<br>')}</p><p>출처별 확인 내용과 검토 한계는 아래 편집 기록에 있습니다.</p></details>`;}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){active=b.dataset.case;render()}});$('#view').addEventListener('click',async e=>{const b=e.target.closest('#copy');if(!b)return;try{await navigator.clipboard.writeText(cases.find(x=>x.id===active).text);b.textContent='복사했어요'}catch{b.textContent='본문을 선택해 복사해 주세요'}});render();
