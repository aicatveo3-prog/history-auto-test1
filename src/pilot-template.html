<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>세 가지 이야기 — 한국사 시나리오 비교</title><style>
:root{--bg:#f4f2ec;--ink:#253b31;--sub:#748071;--line:#dce3d9;--accent:#b75c3e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic',sans-serif}main{max-width:1250px;margin:auto;padding:35px 28px}header{border-bottom:1px solid var(--line);padding:10px 0 28px}.back{font-size:12px;color:var(--sub);text-decoration:none}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--accent);margin-top:35px;font-weight:700}h1{font-size:36px;letter-spacing:-1.5px;margin:12px 0}header p{max-width:760px;font-size:14px;line-height:1.9;color:var(--sub)}button,a{touch-action:manipulation}nav{display:flex;gap:10px;margin:25px 0}nav button{border:1px solid var(--line);border-radius:30px;padding:11px 20px;background:transparent;color:var(--ink);cursor:pointer;font:inherit;font-size:13px}nav button[aria-selected=true]{background:var(--ink);color:white;border-color:var(--ink)}.summary{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;margin:25px 0 12px}h2{font-size:24px;letter-spacing:-.8px;margin:0}.pill{font-size:11px;color:var(--accent);background:#efe0d5;padding:5px 9px;border-radius:20px}.approach{font-size:13px;color:var(--sub);margin:10px 0}.note{font-size:12px;line-height:1.8;padding:13px 16px;border-left:3px solid #cdb89b;background:#ebe9df;margin:16px 0 22px}.grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:18px;align-items:start}.card{background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden}.cardhead{padding:17px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.cardhead b{font-size:13px}.cardhead span{color:var(--sub);font-size:11px}.text{padding:24px 26px;white-space:pre-wrap;line-height:2.1;font-size:15px}.old .text{font-size:13px;color:#788274;line-height:2}.old h3{font-size:14px;line-height:1.6;margin:0;padding:20px 26px 0}.foot{padding:0 26px 23px;font-size:12px}.foot a{color:#5e755d}.copy{cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:7px 11px;color:var(--ink);background:white;font-size:11px}.details{margin:22px 0;padding:20px 24px;background:#eaf0e6;border-radius:12px}.details summary{cursor:pointer;font-weight:bold;font-size:13px}.details li,.details p{font-size:13px;line-height:1.9}.details a{color:#536e4f}footer{margin-top:28px;font-size:12px;line-height:1.9;color:var(--sub)}footer a{color:var(--sub)}@media(max-width:800px){main{padding:24px 15px}h1{font-size:29px}.grid{grid-template-columns:1fr}.old{order:2}.new{order:1}.text{padding:21px;font-size:14px}nav{gap:7px}nav button{padding:10px 13px}h2{font-size:21px}}
</style></head><body><main><header><a class="back" href="한국사_시나리오_사이트.html">← 전체 100편으로 돌아가기</a><div class="eyebrow">THREE WAYS TO TELL HISTORY</div><h1>같은 한국사, 다른 이야기 방식.</h1><p>인물의 선택, 제도의 작동, 유물의 증거를 따라 새로 쓴 세 편입니다. 유형을 골라 읽고 직전 시안과 압축 개정판을 비교해 보세요. 전체 100편 개정의 기준이 된 비교 시안입니다. 인물형·문화형은 해당 상위 주제에 구성 원칙을 반영했습니다.</p></header><nav role="tablist" aria-label="시나리오 유형" id="tabs"></nav><div id="view"></div><footer>실제 낭독 시간은 아직 측정하지 않았습니다. 검토는 작성자의 자체 검토이며 사용자 평가를 기다리는 초안입니다.<br><a href="docs/편집기준.md">자료 출처와 5단계 편집 기록</a> · <a href="한국사_시나리오_사이트.html">전체 시나리오 작업실</a></footer></main><script>
const cases=/*__PILOT_DATA__*/;let active=cases[0].id;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const c=cases.find(x=>x.id===active)||cases[0];$('#tabs').innerHTML=cases.map(x=>`<button role="tab" aria-selected="${x.id===c.id}" data-case="${esc(x.id)}">${esc(x.kind)} · ${esc(x.name)}</button>`).join('');$('#view').innerHTML=`<div class="summary"><span class="pill">${esc(c.kind)} 시안</span><h2>${esc(c.title)}</h2></div><p class="approach">${esc(c.strategy)}</p><p class="note">${esc(c.scope)}</p><div class="grid"><article class="card old"><div class="cardhead"><b>수정 전 · v001</b><span>${c.beforeCharacters}자</span></div><h3>${esc(c.previous.title)}</h3><div class="text">${esc(c.previous.text)}</div></article><article class="card new"><div class="cardhead"><b>압축 개정 · v002</b><span>${c.characters}자 · ${c.reductionPercent}% 압축</span><button class="copy" id="copy">본문 복사</button></div><div class="text" id="narration">${esc(c.text)}</div><div class="foot"><a href="${esc(c.sourcePath)}">이 시나리오 원본 열기 ↗</a></div></article></div><details class="details"><summary>학습 포인트와 출처 확인</summary><ul>${c.goals.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><p>${c.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a>`).join('<br>')}</p><p>출처별 확인 내용과 검토 한계는 아래 편집 기록에 있습니다.</p></details>`;}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){active=b.dataset.case;render()}});$('#view').addEventListener('click',async e=>{const b=e.target.closest('#copy');if(!b)return;try{await navigator.clipboard.writeText(cases.find(x=>x.id===active).text);b.textContent='복사했어요'}catch{b.textContent='본문을 선택해 복사해 주세요'}});render();
</script></body></html>
